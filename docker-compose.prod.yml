# Server only: adds HTTPS on top of docker-compose.yml
# Enabled by COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in the server's .env

services:
  web:
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/default.conf:ro   # replaces the http-only config
      - /etc/letsencrypt:/etc/letsencrypt:ro                         # certificate from Certbot
