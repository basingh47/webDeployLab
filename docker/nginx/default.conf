server {
    listen 80;
    root /var/www/html/public;          # only public/ is reachable from the browser
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;   # static file if it exists, else Laravel
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;          # "app" = the PHP-FPM container
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;                       # hide .env, .git, ...
    }
}
