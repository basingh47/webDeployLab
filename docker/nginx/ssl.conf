# Server only: HTTPS with the Let's Encrypt certificate (used by docker-compose.prod.yml)

server {
    listen 80;
    server_name basingh.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html/public;      # Let's Encrypt checks here when renewing
    }

    location / {
        return 301 https://$host$request_uri;   # everything else → https
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name basingh.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/basingh.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basingh.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
